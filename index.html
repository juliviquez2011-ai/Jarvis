<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Interface</title>
    <style>
        :root {
            --primary-color: #00f0ff;
            --primary-glow: rgba(0, 240, 255, 0.3);
            --bg-color: #050b14;
            --panel-bg: rgba(2, 8, 18, 0.75);
            --border-glow: rgba(0, 240, 255, 0.4);
            --text-main: #7ee8f2;
        }

        body.advanced-mode {
            --primary-color: #ff2a2a;
            --primary-glow: rgba(255, 42, 42, 0.3);
            --bg-color: #140505;
            --panel-bg: rgba(18, 2, 2, 0.75);
            --border-glow: rgba(255, 42, 42, 0.4);
            --text-main: #f27e7e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            transition: background-color 0.8s ease, color 0.8s ease, border-color 0.8s ease, box-shadow 0.8s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            letter-spacing: 2px;
            border-bottom: 1px solid var(--border-glow);
            padding-bottom: 8px;
        }

        .clock-box {
            border: 1px dashed var(--border-glow);
            padding: 5px 15px;
            border-radius: 15px;
            background: var(--panel-bg);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        /* Main Workspace */
        .workspace {
            display: grid;
            grid-template-columns: 320px 1fr 320px;
            gap: 20px;
            flex-grow: 1;
            align-items: center;
            padding: 10px 0;
        }

        /* Panels */
        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 6px;
            padding: 15px;
            box-shadow: inset 0 0 15px var(--primary-glow), 0 0 10px var(--primary-glow);
            height: 100%;
            max-height: 420px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .credentials-panel label {
            font-size: 10px;
            display: block;
            margin-bottom: 3px;
        }

        .credentials-panel input {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-glow);
            color: var(--primary-color);
            padding: 6px;
            border-radius: 4px;
            font-size: 11px;
            margin-bottom: 8px;
            outline: none;
        }

        .btn-credential {
            background: transparent;
            border: 1px solid var(--border-glow);
            color: var(--primary-color);
            padding: 6px;
            font-size: 10px;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            letter-spacing: 1px;
        }

        .btn-credential:hover {
            background: var(--primary-glow);
        }

        .terminal-logs {
            font-size: 11px;
            line-height: 1.4;
            overflow-y: auto;
            flex-grow: 1;
            border-top: 1px dashed var(--border-glow);
            padding-top: 8px;
        }

        /* Center Reactor Core */
        .reactor-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            height: 100%;
        }

        .reactor {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            border: 2px dashed var(--border-glow);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px var(--primary-glow);
            animation: spin 20s linear infinite;
        }

        .reactor-inner {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            border: 2px solid var(--border-glow);
            position: absolute;
            animation: spin-reverse 15s linear infinite;
        }

        .reactor-core-text {
            position: absolute;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 4px;
            color: var(--primary-color);
            text-shadow: 0 0 10px var(--primary-color);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spin-reverse {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        /* Right Panel: 3D Slot */
        .slot-3d-header {
            font-size: 10px;
            text-align: center;
            letter-spacing: 1px;
            border-bottom: 1px dashed var(--border-glow);
            padding-bottom: 5px;
        }

        .cube-viewport {
            width: 100%;
            height: 140px;
            border: 1px dashed var(--border-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: rgba(0,0,0,0.3);
        }

        .wireframe-cube {
            width: 50px;
            height: 50px;
            position: relative;
            transform-style: preserve-3d;
            animation: rotate-cube 10s infinite linear;
        }

        .cube-face {
            position: absolute;
            width: 50px;
            height: 50px;
            border: 1px solid var(--primary-color);
            background: var(--primary-glow);
        }

        .cube-face:nth-child(1) { transform: translateZ(25px); }
        .cube-face:nth-child(2) { transform: rotateY(180deg) translateZ(25px); }
        .cube-face:nth-child(3) { transform: rotateY(-90deg) translateZ(25px); }
        .cube-face:nth-child(4) { transform: rotateY(90deg) translateZ(25px); }
        .cube-face:nth-child(5) { transform: rotateX(90deg) translateZ(25px); }
        .cube-face:nth-child(6) { transform: rotateX(-90deg) translateZ(25px); }

        @keyframes rotate-cube {
            0% { transform: rotateX(0deg) rotateY(0deg); }
            100% { transform: rotateX(360deg) rotateY(360deg); }
        }

        .slot-log {
            font-size: 10px;
            color: var(--text-main);
            opacity: 0.8;
            border: 1px dashed var(--border-glow);
            padding: 8px;
            background: rgba(0,0,0,0.2);
        }

        /* Bottom Control Bar */
        .bottom-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            padding: 8px 15px;
            border-radius: 20px;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .bottom-bar input {
            background: transparent;
            border: none;
            color: var(--primary-color);
            outline: none;
            flex-grow: 1;
            font-size: 13px;
        }

        .bottom-bar input::placeholder {
            color: var(--primary-color);
            opacity: 0.6;
        }

        .send-btn {
            background: var(--primary-glow);
            border: 1px solid var(--border-glow);
            color: var(--primary-color);
            padding: 5px 20px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .send-btn:hover {
            background: var(--primary-color);
            color: var(--bg-color);
        }

        .signature {
            font-size: 11px;
            letter-spacing: 3px;
            font-weight: bold;
            text-align: center;
        }

        .config-btn {
            background: transparent;
            border: 1px solid var(--border-glow);
            color: var(--primary-color);
            padding: 5px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 11px;
        }

        .config-btn:hover {
            background: var(--primary-glow);
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <span>Sat Sep 26 J.A.R.V.I.S. code</span>
        <div class="clock-box" id="clock">12:56:25 PM</div>
        <span>🛡️ 47%</span>
    </div>

    <!-- Workspace -->
    <div class="workspace">
        <!-- Left Panel: Credentials & Terminal -->
        <div class="panel credentials-panel">
            <div>
                <label>Groq:</label>
                <input type="password" value="••••••••••••••••••••••••" readonly>
                <label>Tavily:</label>
                <input type="password" value="tvly-..." readonly>
                <label>AI 3D:</label>
                <input type="password" value="tripo-..." readonly>
                <label>ElevenLabs:</label>
                <input type="password" value="xi-api-key..." readonly>
                <button class="btn-credential">Guardar Credencial</button>
            </div>
            <div class="terminal-logs">
                <p>JARVIS: Núcleo conectado con modelo base, señor. A su orden.</p><br>
                <p id="mode-status-log">JARVIS: Sistema operativo en modo estándar.</p>
            </div>
        </div>

        <!-- Center Reactor -->
        <div class="reactor-container">
            <div class="reactor">
                <div class="reactor-inner"></div>
            </div>
            <div class="reactor-core-text">JARVIS</div>
        </div>

        <!-- Right Panel: 3D Compiler Slot -->
        <div class="panel">
            <div class="slot-3d-header">SLOT 3D & COMPILADOR CAD</div>
            <div class="cube-viewport">
                <div class="wireframe-cube">
                    <div class="cube-face"></div>
                    <div class="cube-face"></div>
                    <div class="cube-face"></div>
                    <div class="cube-face"></div>
                    <div class="cube-face"></div>
                    <div class="cube-face"></div>
                </div>
            </div>
            <div class="slot-log">
                // Sistema de Red Listos...\n> Indique modelo o estructura para compilar en 3D, señor.
            </div>
        </div>
    </div>

    <!-- Bottom Controls -->
    <div class="bottom-bar">
        <span>📁</span>
        <input type="text" id="command-input" placeholder="Indique su orden a JARVIS, señor...">
        <span>🎙️</span>
        <button class="send-btn" onclick="executeCommand()">Enviar</button>
        <span class="signature">J.A.R.V.I.S.</span>
        <button class="config-btn" onclick="toggleAdvancedMode()">⚙️ Config</button>
    </div>

    <script>
        // Reloj en tiempo real
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
        }, 1000);

        // Transición fluida entre modo normal e avanzado (Inspirado en IMG1 e IMG2)
        let isAdvanced = false;
        function toggleAdvancedMode() {
            isAdvanced = !isAdvanced;
            const body = document.body;
            const logElement = document.getElementById('mode-status-log');
            
            if (isAdvanced) {
                body.classList.add('advanced-mode');
                logElement.innerText = "Jarvis activa modo trabajo avanzado";
            } else {
                body.classList.remove('advanced-mode');
                logElement.innerText = "Jarvis apaga modo trabajo avanzado";
            }
        }

        function executeCommand() {
            const input = document.getElementById('command-input');
            const val = input.value.toLowerCase();
            if(val.includes('avanzado') || val.includes('advanced')) {
                toggleAdvancedMode();
            }
            input.value = '';
        }
    </script>
</body>
</html>
