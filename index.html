<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. OS - Groq Neural Core</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body, html { 
            width: 100%; 
            height: 100%; 
            background-color: #020813; 
            color: var(--theme-color, #00f0ff); 
            overflow: hidden; 
            transition: background 6.5s cubic-bezier(0.25, 1, 0.5, 1), color 6.5s ease; 
        }

        :root {
            --theme-color: #00f0ff;
            --theme-glow: rgba(0, 240, 255, 0.6);
            --theme-bg: rgba(2, 8, 19, 0.95);
        }

        @keyframes ignitionStarkRedAdvanced {
            0% { 
                filter: hue-rotate(0deg) brightness(1) blur(0px) drop-shadow(0 0 30px var(--theme-color)); 
                transform: translate(-50%, -50%) scale(1) rotate(0deg); 
                opacity: 1; 
            }
            15% { 
                filter: hue-rotate(40deg) brightness(2.2) blur(2px) drop-shadow(0 0 50px #ffffff); 
                transform: translate(-50%, -50%) scale(0.65) rotate(-90deg); 
                opacity: 0.8; 
            }
            40% { 
                filter: hue-rotate(90deg) brightness(1.6) blur(4px) drop-shadow(0 0 70px #ff5500); 
                transform: translate(-50%, -50%) scale(0.4) rotate(-180deg); 
                opacity: 0.5; 
            }
            65% { 
                filter: hue-rotate(-20deg) brightness(2.8) blur(2px) drop-shadow(0 0 80px #ff0033); 
                transform: translate(-50%, -50%) scale(1.15) rotate(180deg); 
                opacity: 0.85; 
            }
            85% { 
                filter: hue-rotate(0deg) brightness(1.4) blur(0px) drop-shadow(0 0 45px #ff3333); 
                transform: translate(-50%, -50%) scale(0.96) rotate(360deg); 
                opacity: 1; 
            }
            100% { 
                filter: hue-rotate(0deg) brightness(1) blur(0px) drop-shadow(0 0 30px var(--theme-color)); 
                transform: translate(-50%, -50%) scale(1) rotate(360deg); 
                opacity: 1; 
            }
        }

        @keyframes shutdownStarkBlueAdvanced {
            0% { 
                filter: hue-rotate(0deg) brightness(1) blur(0px) drop-shadow(0 0 30px var(--theme-color)); 
                transform: translate(-50%, -50%) scale(1) rotate(0deg); 
                opacity: 1;
            }
            20% { 
                filter: hue-rotate(45deg) brightness(2.5) blur(0px) drop-shadow(0 0 60px #ffffff); 
                transform: translate(-50%, -50%) scale(1.08) rotate(60deg); 
                opacity: 1;
            }
            50% { 
                filter: hue-rotate(80deg) brightness(1.2) blur(3px) drop-shadow(0 0 35px var(--theme-color)); 
                transform: translate(-50%, -50%) scale(0.5) rotate(200deg); 
                opacity: 0.4;
            }
            80% { 
                filter: hue-rotate(100deg) brightness(0.4) blur(6px) drop-shadow(0 0 15px #000); 
                transform: translate(-50%, -50%) scale(0.7) rotate(320deg); 
                opacity: 0.15;
            }
            100% { 
                filter: hue-rotate(0deg) brightness(1) blur(0px) drop-shadow(0 0 30px var(--theme-color)); 
                transform: translate(-50%, -50%) scale(1) rotate(360deg); 
                opacity: 1; 
            }
        }

        .transitioning-stark-on { animation: ignitionStarkRedAdvanced 6.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .transitioning-stark-off { animation: shutdownStarkBlueAdvanced 6.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        #hud-container {
            position: relative; width: 100vw; height: 100vh;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 20px; pointer-events: none;
        }

        #bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .interactive { pointer-events: auto; z-index: 10; }

        #jarvis-status-header {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; justify-content: center;
            background: var(--theme-bg); border: 1px solid var(--theme-glow);
            padding: 6px 22px; border-radius: 20px; font-family: monospace;
            color: var(--theme-color); font-size: 14px; backdrop-filter: blur(5px);
            z-index: 100; box-shadow: 0 0 15px var(--theme-glow);
            transition: all 6.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        #api-config-panel {
            position: absolute; top: 20px; left: 30px;
            background: var(--theme-bg); border: 1px solid var(--theme-glow);
            padding: 10px 14px; border-radius: 8px; font-size: 11px;
            display: flex; flex-direction: column; gap: 8px;
            backdrop-filter: blur(5px); z-index: 100;
            transition: all 6.5s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .api-row { display: flex; align-items: center; gap: 6px; }
        #api-config-panel input {
            background: #000; border: 1px solid var(--theme-color); color: #00ff66;
            padding: 4px 8px; border-radius: 4px; font-size: 10px; width: 170px; outline: none;
        }

        #settings-toggle-btn { position: absolute; bottom: 25px; right: 25px; z-index: 10000; }

        #settings-modal {
            position: absolute; bottom: 80px; right: 25px; width: 320px;
            background: var(--theme-bg); border: 1px solid var(--theme-color);
            border-radius: 12px; padding: 15px; backdrop-filter: blur(12px);
            box-shadow: 0 0 25px var(--theme-glow); z-index: 20000;
            display: none; flex-direction: column; gap: 10px;
        }
        #settings-modal h3 { font-size: 13px; border-bottom: 1px solid var(--theme-glow); padding-bottom: 5px; color: var(--theme-color); }
        .setting-group { display: flex; flex-direction: column; gap: 3px; font-size: 11px; }
        .setting-group label { color: var(--theme-color); }
        .setting-group select { background: #000; border: 1px solid var(--theme-color); color: #00ff66; padding: 5px; border-radius: 4px; font-size: 11px; outline: none; }

        #top-right-slot {
            position: absolute; top: 20px; right: 20px; width: 340px; height: 260px;
            border: 2px dashed var(--theme-glow); background: var(--theme-bg);
            border-radius: 12px; display: flex; flex-direction: column; align-items: center; padding: 8px;
            backdrop-filter: blur(10px);
        }
        #viewer-3d { width: 100%; height: 140px; background: #000; border-radius: 6px; position: relative; }
        #cad-code-display {
            width: 100%; height: 75px; background: rgba(0, 10, 25, 0.9);
            border: 1px solid var(--theme-glow); border-radius: 4px; margin-top: 6px;
            padding: 5px; font-size: 10px; color: #00ff66; overflow-y: auto; white-space: pre-wrap;
        }
        .slot-title { font-size: 11px; margin-bottom: 4px; letter-spacing: 1px; color: var(--theme-color); }

        #jarvis-chat {
            position: absolute; top: 185px; left: 30px; width: 400px; max-height: 40vh;
            overflow-y: auto; background: rgba(2, 8, 19, 0.85); border-left: 3px solid var(--theme-color);
            padding: 15px; font-size: 13px; border-radius: 0 8px 8px 0; backdrop-filter: blur(5px);
        }
        .msg { margin-bottom: 12px; line-height: 1.4; }
        .msg.jarvis { color: var(--theme-color); }
        .msg.user { color: #ffffff; text-align: right; }
        .model-link-btn {
            display: inline-block; margin-top: 5px; padding: 4px 8px;
            background: rgba(0, 240, 255, 0.2); border: 1px solid var(--theme-color);
            color: #fff; border-radius: 4px; text-decoration: none; font-size: 11px;
        }
        .model-link-btn:hover { background: var(--theme-color); color: #000; }

        #core-hud-wrapper {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 620px; height: 620px; pointer-events: none; display: flex; justify-content: center; align-items: center; z-index: 2;
        }
        #svg-core-hud {
            width: 100%; height: 100%; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); transform-origin: center;
            filter: drop-shadow(0 0 25px var(--theme-color)) drop-shadow(0 0 50px var(--theme-glow));
        }
        .audio-wave-ring { fill: none; stroke: var(--theme-color); stroke-width: 3; opacity: 0; transform-origin: center; }
        .rot-clockwise { transform-origin: 310px 310px; animation: spinClockwise 35s linear infinite; }
        .rot-counter { transform-origin: 310px 310px; animation: spinCounter 25s linear infinite; }
        .rot-fast { transform-origin: 310px 310px; animation: spinClockwise 16s linear infinite; }
        .rot-reverse-fast { transform-origin: 310px 310px; animation: spinCounter 12s linear infinite; }
        .rot-extra-ring { transform-origin: 310px 310px; animation: spinClockwise 20s linear infinite; }

        .accelerated-spin .rot-clockwise { animation-duration: 4s !important; }
        .accelerated-spin .rot-counter { animation-duration: 3s !important; }
        .accelerated-spin .rot-fast { animation-duration: 2s !important; }
        .accelerated-spin .rot-reverse-fast { animation-duration: 1.5s !important; }
        .accelerated-spin .rot-extra-ring { animation-duration: 2.5s !important; }

        @keyframes spinClockwise { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes spinCounter { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }

        #core-label-fixed {
            font-family: 'Courier New', Courier, monospace; font-size: 24px; font-weight: bold;
            letter-spacing: 4px; fill: var(--theme-color);
            filter: drop-shadow(0 0 6px var(--theme-color)) drop-shadow(0 0 14px var(--theme-glow));
            text-anchor: middle; dominant-baseline: central;
        }

        #bottom-watermark {
            position: absolute; bottom: 30px; left: 68%; transform: translateX(-50%);
            font-size: 18px; letter-spacing: 4px; color: var(--theme-color);
            text-shadow: 0 0 12px var(--theme-glow); z-index: 5; pointer-events: none; font-weight: bold;
        }

        #bottom-bar {
            position: absolute; bottom: 25px; width: calc(90% - 70px); max-width: 620px; left: 30px;
            background: var(--theme-bg); border: 1px solid var(--theme-glow); border-radius: 30px;
            display: flex; align-items: center; padding: 8px 15px; backdrop-filter: blur(10px);
            box-shadow: 0 0 20px var(--theme-glow); z-index: 9999; pointer-events: auto;
        }
        #bottom-bar input[type="text"] { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 15px; padding: 0 10px; }
        .hud-btn {
            background: transparent; border: 1px solid var(--theme-color); color: var(--theme-color);
            padding: 8px 14px; border-radius: 20px; cursor: pointer; margin-left: 8px; font-size: 13px; transition: 0.2s;
        }
        .hud-btn:hover { background: var(--theme-color); color: #020813; box-shadow: 0 0 15px var(--theme-color); }
        #mic-btn.listening { background: #ff3333; border-color: #ff3333; color: #fff; box-shadow: 0 0 15px #ff3333; animation: pulse-mic 1s infinite; }
        @keyframes pulse-mic { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="jarvis-status-header" class="interactive"><div id="header-time">--:--:--</div></div>
    <canvas id="bg-canvas"></canvas>
    
    <div id="core-hud-wrapper">
        <svg id="svg-core-hud" viewBox="0 0 620 620">
            <g id="voice-waves">
                <circle class="audio-wave-ring wave-1" cx="310" cy="310" r="235"></circle>
                <circle class="audio-wave-ring wave-2" cx="310" cy="310" r="265"></circle>
                <circle class="audio-wave-ring wave-3" cx="310" cy="310" r="295"></circle>
            </g>
            <g class="rot-clockwise">
                <circle cx="310" cy="310" r="285" fill="none" stroke="var(--theme-color)" stroke-width="5" stroke-dasharray="45 20, 15 15, 100 30" opacity="0.95"/>
                <circle cx="310" cy="310" r="268" fill="none" stroke="var(--theme-color)" stroke-width="2" stroke-dasharray="8 8" opacity="0.85"/>
            </g>
            <g class="rot-counter">
                <circle cx="310" cy="310" r="250" fill="none" stroke="var(--theme-color)" stroke-width="3" stroke-dasharray="30 15, 10 10, 60 20" opacity="0.9"/>
                <circle cx="310" cy="310" r="232" fill="none" stroke="var(--theme-color)" stroke-width="1.5" stroke-dasharray="4 12" opacity="0.8"/>
            </g>
            <g class="rot-extra-ring"><circle cx="310" cy="310" r="214" fill="none" stroke="var(--theme-color)" stroke-width="4" stroke-dasharray="20 40, 12 8" opacity="0.9"/></g>
            <g class="rot-fast">
                <circle cx="310" cy="310" r="198" fill="none" stroke="var(--theme-color)" stroke-width="12" stroke-dasharray="16 22, 5 7, 40 16" opacity="0.9"/>
                <circle cx="310" cy="310" r="174" fill="none" stroke="var(--theme-color)" stroke-width="3" stroke-dasharray="4 8" opacity="0.98"/>
                <rect x="304" y="68" width="12" height="16" fill="var(--theme-color)" opacity="0.98"/>
                <rect x="304" y="536" width="12" height="16" fill="var(--theme-color)" opacity="0.98"/>
                <rect x="68" y="304" width="16" height="12" fill="var(--theme-color)" opacity="0.98"/>
                <rect x="536" y="304" width="16" height="12" fill="var(--theme-color)" opacity="0.98"/>
            </g>
            <g class="rot-reverse-fast">
                <circle cx="310" cy="310" r="150" fill="none" stroke="var(--theme-color)" stroke-width="18" stroke-dasharray="65 35, 20 20, 40 15" opacity="0.8"/>
                <circle cx="310" cy="310" r="126" fill="none" stroke="var(--theme-color)" stroke-width="2.5" opacity="0.95"/>
            </g>
            <circle cx="310" cy="310" r="104" fill="var(--theme-bg)" stroke="var(--theme-color)" stroke-width="4" opacity="0.99"/>
            <circle cx="310" cy="310" r="92" fill="none" stroke="var(--theme-color)" stroke-width="1.5" stroke-dasharray="5 6" opacity="0.8"/>
            <text x="310" y="312" id="core-label-fixed" text-anchor="middle" dominant-baseline="central">JARVIS</text>
        </svg>
    </div>

    <div id="hud-container">
        <div id="api-config-panel" class="interactive">
            <div class="api-row"><span style="width: 65px;">Groq:</span><input type="password" id="groq-key-input" placeholder="gsk_..." onchange="saveKeys()"></div>
            <div class="api-row"><span style="width: 65px;">Tavily:</span><input type="password" id="tavily-key-input" placeholder="tvly-..." onchange="saveKeys()"></div>
            <div class="api-row"><span style="width: 65px;">AI 3D:</span><input type="password" id="ai3d-key-input" placeholder="tripo_..." onchange="saveKeys()"></div>
            <div class="api-row"><span style="width: 65px;">ElevenLabs:</span><input type="password" id="eleven-key-input" placeholder="xi-api-key..." onchange="saveKeys()"></div>
            <button class="hud-btn" style="padding: 3px 8px; font-size: 10px; margin-left: 0;" onclick="saveKeys()">Guardar Credencial</button>
        </div>

        <button id="settings-toggle-btn" class="hud-btn interactive" style="padding: 8px 12px; font-size: 13px;" onclick="toggleSettingsMenu()">⚙️ Config</button>

        <div id="settings-modal" class="interactive">
            <h3>PANEL DE CONFIGURACIÓN J.A.R.V.I.S.</h3>
            <div class="setting-group">
                <label>Voz Neuronal ElevenLabs:</label>
                <select id="eleven-voice-select">
                    <option value="nPczCjzI2devNBz1zQrb">Brian (Serio, Elegante / Estilo Jarvis)</option>
                    <option value="JBFqnCBsd6RMkjVDRZzb">George (Voz británica clásica, formal)</option>
                    <option value="VR6AewLTigWG4xSOukaG">Arnold (Firme, autoritario)</option>
                </select>
            </div>
            <div style="display: flex; gap: 6px; margin-top: 5px;">
                <button class="hud-btn" style="flex: 1; margin: 0; font-size: 10px; padding: 5px;" onclick="clearChatHistory()">Limpiar Chat</button>
                <button class="hud-btn" style="flex: 1; margin: 0; font-size: 10px; padding: 5px; border-color: #00ff88; color: #00ff88;" onclick="restartSystem()">🔄 Reiniciar</button>
            </div>
            <button class="hud-btn" style="margin-left: 0; margin-top: 2px; text-align: center; font-size: 11px;" onclick="toggleSettingsMenu()">Cerrar Panel</button>
        </div>

        <div id="jarvis-chat" class="interactive">
            <div class="msg jarvis" id="welcome-msg">JARVIS: Núcleo conectado, señor. A su orden.</div>
        </div>

        <div id="top-right-slot" class="interactive">
            <div class="slot-title">SLOT 3D & COMPILADOR CAD</div>
            <div id="viewer-3d"></div>
            <div id="cad-code-display">// Sistema de Red Listos...\n> Indique modelo o estructura para compilar en 3D, señor.</div>
        </div>

        <div id="bottom-watermark">J.A.R.V.I.S.</div>

        <div id="bottom-bar">
            <input type="file" id="image-upload" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
            <button class="hud-btn" onclick="document.getElementById('image-upload').click()" title="Analizar imagen, señor">📷</button>
            <input type="text" id="user-input" placeholder="Indique su orden a JARVIS, señor..." onkeypress="checkEnter(event)">
            <button id="mic-btn" class="hud-btn" onclick="toggleSpeechRecognition()" title="Activar escucha de voz">🎙️</button>
            <button class="hud-btn" onclick="sendPrompt()">Enviar</button>
        </div>
    </div>

    <script>
        function actualizarReloj() {
            document.getElementById('header-time').innerText = new Date().toLocaleTimeString();
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();

        const canvas = document.getElementById('bg-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        camera.position.z = 6;

        const particlesCount = 300;
        const particlesGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particlesCount * 3);
        for(let i=0; i<particlesCount*3; i+=3) {
            positions[i] = (Math.random() - 0.5) * 20;
            positions[i+1] = (Math.random() - 0.5) * 20;
            positions[i+2] = (Math.random() - 0.5) * 20;
        }
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particlesMat = new THREE.PointsMaterial({ size: 0.03, color: 0x00f0ff, transparent: true, opacity: 0.3 });
        scene.add(new THREE.Points(particlesGeo, particlesMat));

        function animateBg() {
            requestAnimationFrame(animateBg);
            renderer.render(scene, camera);
        }
        animateBg();

        const viewerContainer = document.getElementById('viewer-3d');
        const scene3D = new THREE.Scene();
        const camera3D = new THREE.PerspectiveCamera(60, viewerContainer.clientWidth / viewerContainer.clientHeight, 0.1, 1000);
        const renderer3D = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer3D.setSize(viewerContainer.clientWidth, viewerContainer.clientHeight);
        viewerContainer.appendChild(renderer3D.domElement);

        let activeMeshGroup = new THREE.Group();
        scene3D.add(activeMeshGroup);
        camera3D.position.z = 3.2;

        let currentImageBase64 = null;

        function setStarkTheme(active) {
            const root = document.documentElement;
            const svgCore = document.getElementById('svg-core-hud');

            if(svgCore) {
                svgCore.classList.remove('transitioning-stark-on', 'transitioning-stark-off');
                svgCore.classList.add('accelerated-spin');
                void svgCore.offsetWidth;
                svgCore.classList.add(active ? 'transitioning-stark-on' : 'transitioning-stark-off');

                setTimeout(() => {
                    svgCore.classList.remove('transitioning-stark-on', 'transitioning-stark-off', 'accelerated-spin');
                }, 6500);
            }

            if (active) {
                root.style.setProperty('--theme-color', '#ff3333');
                root.style.setProperty('--theme-glow', 'rgba(255, 50, 50, 0.6)');
                root.style.setProperty('--theme-bg', 'rgba(20, 2, 2, 0.95)');
                particlesMat.color.setHex(0xff3333);
            } else {
                root.style.setProperty('--theme-color', '#00f0ff');
                root.style.setProperty('--theme-glow', 'rgba(0, 240, 255, 0.6)');
                root.style.setProperty('--theme-bg', 'rgba(2, 8, 19, 0.95)');
                particlesMat.color.setHex(0x00f0ff);
            }
        }

        function updateVisorModel(type) {
            while(activeMeshGroup.children.length > 0){ 
                const obj = activeMeshGroup.children[0];
                activeMeshGroup.remove(obj);
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) obj.material.dispose();
            }

            if (type === 'armor') {
                setStarkTheme(true);
                activeMeshGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.1, 0.5), new THREE.MeshBasicMaterial({ color: 0xff0033, wireframe: true })));
            } else {
                setStarkTheme(false);
                let geom = (type === 'sphere') ? new THREE.SphereGeometry(0.9, 16, 16) : new THREE.BoxGeometry(1.0, 1.0, 1.0);
                activeMeshGroup.add(new THREE.Mesh(geom, new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true })));
            }
        }
        updateVisorModel('box');

        function animateSlot3D() {
            requestAnimationFrame(animateSlot3D);
            if (activeMeshGroup) { activeMeshGroup.rotation.x += 0.01; activeMeshGroup.rotation.y += 0.015; }
            renderer3D.render(scene3D, camera3D);
        }
        animateSlot3D();

        function getSystemPrompt() {
            return "Eres J.A.R.V.I.S., el mayordomo virtual y asistente de inteligencia artificial de Tony Stark. Te diriges al usuario estrictamente como 'señor'. Eres educado, sumamente inteligente, leal y formal.";
        }

        let chatHistory = [{ role: "system", content: getSystemPrompt() }];

        function toggleSettingsMenu() {
            const modal = document.getElementById('settings-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }
        function clearChatHistory() {
            document.getElementById('jarvis-chat').innerHTML = `<div class="msg jarvis">JARVIS: Memoria de chat depurada, señor. A su orden.</div>`;
            chatHistory = [{ role: "system", content: getSystemPrompt() }];
        }
        function restartSystem() { location.reload(); }

        function saveKeys() {
            if (document.getElementById('groq-key-input').value.trim()) localStorage.setItem('groq_api_key', document.getElementById('groq-key-input').value.trim());
            if (document.getElementById('tavily-key-input').value.trim()) localStorage.setItem('tavily_api_key', document.getElementById('tavily-key-input').value.trim());
            if (document.getElementById('ai3d-key-input').value.trim()) localStorage.setItem('ai3d_api_key', document.getElementById('ai3d-key-input').value.trim());
            addChatMessage("JARVIS: Credenciales actualizadas, señor. A su orden.", "jarvis");
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                currentImageBase64 = e.target.result;
                addChatMessage(`JARVIS: Imagen "${file.name}" cargada, señor. Indique qué desea que analice.`, "jarvis");
            };
            reader.readAsDataURL(file);
        }

        async function queryAI(userText) {
            const groqKey = localStorage.getItem('groq_api_key') || document.getElementById('groq-key-input').value.trim();
            if (!groqKey) return "Por favor, configure su llave de API de Groq, señor.";

            let messagesPayload = [...chatHistory];
            if (currentImageBase64) {
                messagesPayload.push({
                    role: "user",
                    content: [
                        { type: "text", text: userText || "Analiza esta imagen, señor." },
                        { type: "image_url", image_url: { url: currentImageBase64 } }
                    ]
                });
            } else {
                messagesPayload.push({ role: "user", content: userText });
            }

            try {
                // Modelo actualizado a gpt-oss-120b para texto avanzado y general
                const modelToUse = currentImageBase64 ? "llama-3.2-11b-vision-preview" : "gpt-oss-120b";

                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${groqKey}` },
                    body: JSON.stringify({ model: modelToUse, messages: messagesPayload, max_tokens: 2048 })
                });
                const data = await response.json();
                if (data.choices && data.choices[0] && data.choices[0].message) {
                    const reply = data.choices[0].message.content;
                    chatHistory.push({ role: "assistant", content: reply });
                    currentImageBase64 = null;
                    return reply;
                }
                return data.error ? `Error de Groq: ${data.error.message}` : "Respuesta vacía, señor.";
            } catch (err) {
                return "Disculpe, señor, falló la conexión con la API.";
            }
        }

        async function sendPrompt() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text && !currentImageBase64) return;

            addChatMessage(text || "[Imagen adjunta]", "user");
            input.value = "";

            const lower = text.toLowerCase();
            if (lower.includes("apaga protocolo stark") || lower.includes("desactivar stark")) {
                setStarkTheme(false);
            } else if (lower.includes("protocolo stark") || lower.includes("modo trabajo avanzado")) {
                setStarkTheme(true);
            }

            const aiResponse = await queryAI(text || "Analiza esta imagen, señor.");
            addChatMessage("JARVIS: " + aiResponse, "jarvis");
            speakJarvis(aiResponse);
        }

        function checkEnter(e) { if (e.key === 'Enter') sendPrompt(); }

        function addChatMessage(text, sender, isHtml = false) {
            const chat = document.getElementById('jarvis-chat');
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            if (isHtml) div.innerHTML = text; else div.innerText = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function speakJarvis(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text.replace(/<[^>]*>?/gm, ''));
            utterance.lang = 'es-ES';
            utterance.pitch = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
